<button
  type="button"
  class="card"
  [class.selected]="selected()"
  [class.overdrawn]="overdrawn()"
  (click)="choose.emit(account().id)"
>
  <span class="card-head">
    <span
      class="avatar"
      aria-hidden="true"
      [attr.data-tone]="account().id % 4"
      [attr.data-initial]="account().customerFirstName.charAt(0)"
    ></span>
    <span class="identity">
      <span class="holder">{{ holder() }}</span>
      <span class="iban">{{ account().iban | iban }}</span>
    </span>
  </span>

  <div class="amounts">
    <app-amount class="balance" [value]="account().balance" />
    @if (overdrawn()) {
    <span class="overdrafted">À découvert</span>
    }
    @if (account().overdraftLimit === 0) {
    <span class="no-overdraft">Découvert non autorisé</span>
    } @else {
    <span class="overdraft">
      Découvert autorisé : {{ account().overdraftLimit | currency: "EUR" }}
    </span>
    }
  </div>
</button>
